[workspace]
resolver = "3"
members = ["crates/*", "extensions/*", "apps/bareline", "apps/extension-host", "apps/update-helper", "native/lexilla-bridge", "xtask"]
default-members = ["apps/bareline"]
# cargo-fuzz targets are a separate workspace with their own lockfile (QA-05).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
winit = "=0.30.13"
windows = "=0.62.2"

[profile.release]
# No unwinding in release: `catch_unwind` is inert. The app's fatal panic hook
# (bareline_diagnostics::install_fatal_panic_hook) seals recovery work and aborts.
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = "line-tables-only"






[patch.crates-io]
accesskit_windows = { path = "vendor/accesskit_windows-0.35.0" }
