# P5-4 (ARCH-07): no window_app function may exceed 300 lines. The
# `clippy::too_many_lines` lint is allow-by-default, so this threshold only
# takes effect where that lint is enabled: the `bareline` app crate root
# enables it (ARC-01), and its existing oversized functions carry an
# explicit `#[allow(clippy::too_many_lines)]`.
too-many-lines-threshold = 300
