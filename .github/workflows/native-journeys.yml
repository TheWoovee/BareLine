name: Native journeys
on:
  schedule:
    - cron: '41 2 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
# Drives the real Windows UI on a disposable hosted runner. Never runs on pull
# requests and is not a required check; flakiness is measured, not gated.
permissions:
  contents: read
concurrency:
  group: native-journeys-${{ github.ref }}
  cancel-in-progress: false
jobs:
  known-good:
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned upstream revision
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the release editor
        run: |
          cargo build -p bareline --release --locked
          if ($LASTEXITCODE) { throw 'Release editor build failed' }
      - name: Run the four known-good journeys three times each
        run: python tests/e2e/journey_matrix.py run --executable target/release/bareline.exe --commit $env:GITHUB_SHA --attempts 3 --output target/native-journeys --summary $env:GITHUB_STEP_SUMMARY
      - name: Retain journey results, observations and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/native-journeys/
          if-no-files-found: warn
          retention-days: 30
