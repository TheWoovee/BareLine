name: Port smoke
# Proves the Linux and macOS port on hosted runners after every push to the
# port integration branch (and on demand): builds the release editor, renders
# the software renderer probe offscreen, launches the editor with a sample file,
# waits for its window, records launch time and resident memory, screenshots it,
# quits it with SIGTERM and checks the exit was clean, then runs the port
# crates' tests. Window existence and a clean exit are asserted; pixel content is
# not. Not a required check, and it never runs on pull requests.
on:
  push:
    branches: [port-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: port-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      LABEL: ${{ matrix.label }}
      # Where the built editor and probe are; a local dry run uses target/debug.
      BUILD_DIR: target/release
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # pinned upstream revision
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The neutral job's build packages, the runtime libraries winit loads on
      # X11, and the display, screenshot and window tools the smoke drives.
      - name: Install the Linux build packages and display tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxkbcommon-x11-0 libxcursor1 xvfb xauth scrot xdotool x11-utils at-spi2-core fonts-dejavu-core fonts-noto-cjk
      - name: Smoke helper regressions
        run: python -m unittest discover -s scripts -p 'test_port_smoke.py'
      - name: Build the release editor and the software renderer probe
        id: build
        run: |
          cargo build -p bareline --release --locked
          cargo build -p bareline-renderer-soft --release --locked --example soft_probe
      - name: Render the probe offscreen
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p evidence
          "$BUILD_DIR/examples/soft_probe" --offscreen "evidence/$LABEL-offscreen.png" 2>&1 | tee "evidence/$LABEL-offscreen.log"
          test -s "evidence/$LABEL-offscreen.png"
      - name: Launch, measure, screenshot and quit the editor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          scratch="$RUNNER_TEMP/port-smoke"
          mkdir -p "$scratch" evidence
          cp crates/renderer-soft/examples/soft_probe.rs "$scratch/soft_probe.rs"
          smoke=(python scripts/port_smoke.py --label "$LABEL" --executable "$BUILD_DIR/bareline" --sample "$scratch/soft_probe.rs" --evidence evidence --profile "$scratch/profile" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$RUNNER_OS" = Linux ]; then
            # Xvfb without a window manager. With WAYLAND_DISPLAY unset winit uses X11,
            # where xdotool finds the window by its _NET_WM_PID.
            env -u WAYLAND_DISPLAY xvfb-run -a -s '-screen 0 1600x1000x24' "${smoke[@]}" --require-window --require-screenshot
          else
            # The runner's logged-in GUI session; the Quartz window list needs no permission.
            "${smoke[@]}"
          fi
      - name: Port crate tests (all failures reported)
        id: port_tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence/test-logs | Out-Null
          cargo test -p bareline-platform-posix -p bareline-platform-linux -p bareline-platform-macos -p bareline-renderer-soft --locked --no-fail-fast 1> evidence/test-logs/port-tests.stdout.log 2> evidence/test-logs/port-tests.stderr.log
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath evidence/test-logs/port-tests.stderr.log, evidence/test-logs/port-tests.stdout.log
          python .github/workflows/libtest_junit.py --stdout evidence/test-logs/port-tests.stdout.log --stderr evidence/test-logs/port-tests.stderr.log --output evidence/test-logs/port-tests.junit.xml
          # A report problem must not mask or replace the test result itself.
          if ($LASTEXITCODE) { Write-Output '::warning::JUnit conversion failed; the raw test logs are retained.' }
          exit $testExit
      # packaging/macos/bundle.sh arrives with the macOS services branch; until
      # then (or while it is not executable in git) the bundle steps are skipped.
      - name: Look for the macOS bundle script
        id: bundle_script
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build.outcome == 'success' }}
        run: |
          if [ -x packaging/macos/bundle.sh ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::packaging/macos/bundle.sh is absent or not executable; no .app or .dmg is built.'
          fi
      - name: Bundle the editor as a .app zip and a .dmg
        id: bundle
        if: ${{ !cancelled() && steps.bundle_script.outputs.present == 'true' }}
        run: |
          marker="$RUNNER_TEMP/bundle.marker"
          touch "$marker"
          sleep 1
          packaging/macos/bundle.sh
          mkdir -p bundle
          # Collect what the script produced, wherever it wrote it.
          find . -path ./.git -prune -o -path ./bundle -prune -o -type f \( -name '*.dmg' -o -name '*.zip' \) -newer "$marker" -print0 | xargs -0 -I{} cp {} bundle/
          if ! ls bundle/*.zip >/dev/null 2>&1; then
            # A script that leaves the .app unzipped still yields the zip.
            find . -path ./.git -prune -o -path ./bundle -prune -o -type d -name '*.app' -newer "$marker" -print -prune | while read -r app; do
              ditto -c -k --keepParent "$app" "bundle/$(basename "$app").zip"
            done
          fi
          ls -l bundle
          ls bundle/*.zip >/dev/null 2>&1 || { echo '::error::bundle.sh produced no .app zip'; exit 1; }
          ls bundle/*.dmg >/dev/null 2>&1 || { echo '::error::bundle.sh produced no .dmg'; exit 1; }
      - name: Retain the macOS bundle
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: port-smoke-${{ matrix.label }}-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Retain screenshots, metrics, editor output and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: port-smoke-${{ matrix.label }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
