name: Informational nightly performance
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
# Local workflow definition only. An owner must opt in on the repository before it runs.
permissions:
  contents: read
jobs:
  measure:
    if: vars.BARELINE_PERF_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - run: cargo build -p bareline -p xtask --release --locked
      - name: Hosted Windows launch and idle series
        run: .\target\release\xtask.exe perf launch --release --samples 3
      - name: Bounded source and product workload series
        if: always()
        run: .\target\release\xtask.exe perf document --bytes 1048576 --samples 3 --product
      - name: Summarize hosted history without comparative claims
        if: always()
        run: python tests/perf/perf_suite.py summarize-legacy tests/perf/results tests/perf/results/hosted-report.json
      - name: Preserve raw run history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-windows-perf-${{ github.sha }}-${{ github.run_id }}
          path: tests/perf/results/
          retention-days: 90
          if-no-files-found: warn
  report-regressions:
    needs: measure
    if: always() && vars.BARELINE_PERF_ENABLED == 'true' && vars.BARELINE_PERF_ISSUES_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Download current and rolling raw history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: pwsh
        run: |
          gh run download $env:CURRENT_RUN --pattern 'hosted-windows-perf-*' --dir current
          $runs = @(gh run list --workflow perf-nightly.yml --status completed --limit 8 --json databaseId,headSha | ConvertFrom-Json)
          $previous = @($runs | Where-Object { [string]$_.databaseId -ne $env:CURRENT_RUN } | Select-Object -First 7)
          $previous | ConvertTo-Json -Depth 5 | Set-Content previous-runs.json
          foreach ($run in $previous) {
            gh run download $run.databaseId --pattern 'hosted-windows-perf-*' --dir ('history/' + $run.databaseId)
          }
      - name: Compute informational rolling regressions
        shell: pwsh
        run: |
          $candidate = Get-ChildItem current -Filter hosted-report.json -Recurse | Select-Object -First 1
          $previous = @(Get-Content previous-runs.json -Raw | ConvertFrom-Json)
          $history = @($previous | ForEach-Object { Get-ChildItem ('history/' + $_.databaseId) -Filter hosted-report.json -Recurse | Select-Object -First 1 })
          if ($candidate -and $previous.Count -eq 7 -and $history.Count -eq 7) {
            python tests/perf/perf_suite.py regress $candidate.FullName regressions.json @($history.FullName)
          }
      - name: Open or update opt-in tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('regressions.json')) return;
            const report = JSON.parse(fs.readFileSync('regressions.json', 'utf8'));
            if (!report.findings?.length) return;
            const title = 'Informational hosted performance regression';
            const marker = '<!-- bareline-perf-regression -->';
            const body = `${marker}\nHosted noise series; numbers do not fail CI or establish comparative claims.\n\nCommit: ${context.sha}\nPrevious seven commits: ${report.baseline_commits.join(', ')}\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              '```json\n' + JSON.stringify(report.findings, null, 2) + '\n```';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state:'open', per_page:100});
            const existing = issues.find(i => i.title === title && i.body?.includes(marker));
            if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
# Every numerical result is informational. Both execution and issue reporting require
# separate repository opt-ins. This definition is not an authorization to run/publish now.
