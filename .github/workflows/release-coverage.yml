name: Release-mode, feature and ARM64 coverage
on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    tags: ['v*']
  workflow_dispatch:
# Weekly and per-tag coverage that is too slow for pull requests. Not a
# required check.
permissions:
  contents: read
concurrency:
  group: release-coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-tests:
    # The release profile compiles out debug_assert! and uses fat LTO, so it
    # exercises code paths the debug-profile PR tests do not.
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned upstream revision
        with:
          toolchain: '1.98.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Release-profile tests for the core crates
        run: |
          New-Item -ItemType Directory -Force target/test-logs | Out-Null
          cargo test --release --locked --no-fail-fast -p bareline-document -p bareline-file-io -p bareline-search -p bareline-diff -p bareline-editor-surface -p bareline-app 1> target/test-logs/cargo-test-release.stdout.log 2> target/test-logs/cargo-test-release.stderr.log
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath target/test-logs/cargo-test-release.stderr.log, target/test-logs/cargo-test-release.stdout.log
          python .github/workflows/libtest_junit.py --stdout target/test-logs/cargo-test-release.stdout.log --stderr target/test-logs/cargo-test-release.stderr.log --output target/test-logs/cargo-test-release.junit.xml
          if ($LASTEXITCODE) { Write-Output '::warning::JUnit conversion failed; the raw test logs are retained.' }
          exit $testExit
      - name: Retain release-profile test logs and JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-profile-tests
          path: target/test-logs/
          if-no-files-found: warn
          retention-days: 30

  feature-coverage:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned upstream revision
        with:
          toolchain: '1.98.1'
      # The release-feature build scripts validate their configuration with Python.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: cargo install --locked cargo-hack --version 0.6.45
      - name: Check every workspace feature on its own (qa-faults, qa-inventory, perf-spans, wat)
        run: |
          # The release features need a prepared configuration; checked below.
          cargo hack check --workspace --all-targets --each-feature --locked --exclude-features configured-release,fixture-release
          if ($LASTEXITCODE) { throw 'A feature does not compile on its own' }
      - name: Run the qa-faults save-boundary tests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p bareline-file-io --features qa-faults
          if ($LASTEXITCODE) { throw 'qa-faults tests failed' }
      - name: Compile fixture-release and configured-release
        if: ${{ !cancelled() }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'release-feature-configs'
          New-Item -ItemType Directory -Force $work | Out-Null
          python scripts/release_config.py prepare --config release/fixtures/nonshipping.release-config.json --mode fixture --output (Join-Path $work 'fixture.prepared')
          if ($LASTEXITCODE) { throw 'Fixture configuration preparation failed' }
          # Compile-only configured input with synthetic keys, as in
          # scripts/test_release_config.py. No binary from it is kept or run.
          $config = Get-Content -Raw -LiteralPath release/fixtures/nonshipping.release-config.json | ConvertFrom-Json
          $config.mode = 'configured'
          $config.updates.host = 'releases.bareline.app'
          foreach ($pair in @(@('release_public_key', 'EdRELEASE1', 11), @('catalog_public_key', 'EdCATALOG1', 12), @('offline_root_public_key', 'EdOFFLINE1', 14))) {
            $config.trust.($pair[0]) = [Convert]::ToBase64String([byte[]](@([Text.Encoding]::ASCII.GetBytes($pair[1])) + @([byte]$pair[2]) * 32))
          }
          $config.trust.publisher_certificate_sha256 = '1' * 64
          $configured = Join-Path $work 'configured.json'
          [IO.File]::WriteAllText($configured, ($config | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          python scripts/release_config.py prepare --config $configured --mode configured --output (Join-Path $work 'configured.prepared')
          if ($LASTEXITCODE) { throw 'Compile-only configured preparation failed' }
          foreach ($feature in @('fixture-release', 'configured-release')) {
            $env:BARELINE_PREPARED_RELEASE_CONFIG = Join-Path $work ($feature.Split('-')[0] + '.prepared')
            cargo check --locked --all-targets -p bareline -p bareline-update-helper -p bareline-extension-host --features "bareline/$feature,bareline-update-helper/$feature,bareline-extension-host/$feature"
            if ($LASTEXITCODE) { throw "$feature does not compile" }
          }

  arm64-build:
    # Buildability only: ARM64 is not yet a release asset.
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # pinned upstream revision
        with:
          toolchain: '1.98.1'
      - name: Build the preview executables for Windows on Arm
        env:
          CARGO_INCREMENTAL: '0'
          # The x86_64 hardening in .cargo/config.toml, repeated for this target.
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static -C control-flow-guard'
          CFLAGS_aarch64_pc_windows_msvc: /guard:cf
          CXXFLAGS_aarch64_pc_windows_msvc: /guard:cf
        run: |
          rustup target add aarch64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'ARM64 Rust target unavailable' }
          cargo build --locked --release --target aarch64-pc-windows-msvc -p bareline -p bareline-update-helper --no-default-features
          if ($LASTEXITCODE) { throw 'ARM64 build failed' }
          foreach ($name in @('bareline.exe', 'bareline-update-helper.exe')) {
            $bytes = [IO.File]::ReadAllBytes("target/aarch64-pc-windows-msvc/release/$name")
            $header = [BitConverter]::ToInt32($bytes, 0x3c)
            if ([BitConverter]::ToUInt32($bytes, $header) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $header + 4) -ne 0xAA64) { throw "$name is not an ARM64 PE image" }
          }
      - name: Retain unsigned ARM64 executables for manual device checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-unsigned-executables
          path: |
            target/aarch64-pc-windows-msvc/release/bareline.exe
            target/aarch64-pc-windows-msvc/release/bareline-update-helper.exe
          if-no-files-found: error
          retention-days: 14
