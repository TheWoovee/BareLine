[package]
name = "bareline-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bareline-commands = { path = "../commands" }
bareline-ui = { path = "../ui" }
bareline-renderer = { path = "../renderer" }
unicode-segmentation = "=1.13.3"
bareline-document = { path = "../document" }
bareline-editor-surface = { path = "../editor-surface" }
bareline-file-io = { path = "../file-io" }
bareline-platform = { path = "../platform" }
bareline-search = { path = "../search" }
bareline-syntax = { path = "../syntax" }
bareline-settings = { path = "../settings" }
bareline-diff = { path = "../diff" }
bareline-macros = { path = "../macros" }
sha2 = "=0.10.9"
sha1 = "=0.10.6"
md-5 = "=0.10.6"
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

bareline-extensions-protocol = { path = '../extensions-protocol' }

[dev-dependencies]
bareline-renderer-recording = { path = "../renderer-recording" }


