[package]
name = "bareline-platform-posix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bareline-platform = { path = "../platform" }

# The crate is an empty unit off Unix; the system bindings are Unix-only.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "param", "process"] }
sha2 = "=0.10.9"
bareline-distribution = { path = "../distribution" }
bareline-extensions-protocol = { path = "../extensions-protocol" }
bareline-macros = { path = "../macros" }
# proc_pidinfo on macOS; localtime_r for trash records everywhere.
libc = "=0.2.189"
