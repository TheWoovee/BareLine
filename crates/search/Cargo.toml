[package]
name = "bareline-search"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bareline-document = { path = "../document" }
bareline-file-io = { path = "../file-io" }
bareline-platform = { path = "../platform" }
pcre2-sys = "=0.2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
bareline-unicode-fold = { path = "../unicode-fold" }

[target.'cfg(windows)'.dev-dependencies]
bareline-platform-windows = { path = "../platform-windows" }
