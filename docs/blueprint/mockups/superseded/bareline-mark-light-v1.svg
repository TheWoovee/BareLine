       Bowl outer bounds y=10..24. Fold top right; accent cut delta=(2,-2). -->
  <g stroke="#23272B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path id="stem" d="M3 1.5V22.5"/>
    <path id="bowl" d="M3 11.5H17L21 15.5V20.5L19 22.5H4.5Q3 22.5 3 21"/>
    <path id="fold" d="M17 11.5V15.5H21"/>
