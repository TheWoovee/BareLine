[package]
name = "bareline"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
qa-inventory = ["bareline-platform-windows/qa-inventory"]
perf-spans = ["bareline-renderer/perf-spans", "bareline-diagnostics/perf-spans"]
configured-release = []
fixture-release = ["bareline-platform-windows/fixture-release"]
qa-faults = ["bareline-file-io/qa-faults", "dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
bareline-search = { path = "../../crates/search" }
bareline-app = { path = "../../crates/app" }
bareline-commands = { path = "../../crates/commands" }
bareline-diagnostics = { path = "../../crates/diagnostics" }
bareline-platform = { path = "../../crates/platform" }
bareline-renderer = { path = "../../crates/renderer" }
bareline-settings = { path = "../../crates/settings" }
bareline-ui = { path = "../../crates/ui" }
bareline-file-io = { path = "../../crates/file-io" }
bareline-document = { path = "../../crates/document" }
bareline-syntax = { path = "../../crates/syntax" }
sha2 = "=0.10.9"

bareline-distribution = { path = "../../crates/distribution" }
bareline-editor-surface = { path = "../../crates/editor-surface" }

bareline-extensions-protocol = { path = '../../crates/extensions-protocol' }


bareline-diff = { path = "../../crates/diff" }
winit.workspace = true

# The shell reaches each platform only through `src/shell/native`.
[target.'cfg(windows)'.dependencies]
bareline-platform-windows = { path = "../../crates/platform-windows" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
# The portable software renderer (PR-029) and the POSIX file system, process
# identity, trash and data folders (PR-030).
bareline-renderer-soft = { path = "../../crates/renderer-soft" }
bareline-platform-posix = { path = "../../crates/platform-posix" }

[target.'cfg(target_os = "linux")'.dependencies]
bareline-platform-linux = { path = "../../crates/platform-linux" }

[target.'cfg(target_os = "macos")'.dependencies]
bareline-platform-macos = { path = "../../crates/platform-macos" }


[target.'cfg(windows)'.dev-dependencies]
# Process-level startup tests look for the editor's top-level window.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
# Visual baseline cells render offscreen through the production renderer.
bareline-platform-windows = { path = "../../crates/platform-windows", features = ["offscreen"] }

[dev-dependencies]
serde_json = "1"
bareline-renderer-recording = { path = "../../crates/renderer-recording" }
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
blake2 = "=0.10.6"
sha2 = "=0.10.9"
