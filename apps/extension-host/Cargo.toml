[package]
name = "bareline-extension-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Development only: accepts the WebAssembly text format, which is extra parser
# surface that production hosts must not expose (SEC-08).
wat = ["wasmtime/wat"]
configured-release = []
fixture-release = []

[dependencies]
bareline-extensions-protocol = { path = "../../crates/extensions-protocol" }
wasmtime = { version = "=48.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "anyhow"] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p2"] }
[target.'cfg(windows)'.dependencies]
bareline-platform-windows = { path = "../../crates/platform-windows" }

sha2 = "=0.10.9"

[dev-dependencies]
bareline-macros = { path = "../../crates/macros" }
wat = "=1.258.0"
